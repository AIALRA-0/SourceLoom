[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sourceloom"
version = "0.1.0"
description = "Traceable source rewriting and content preprocessing for ReadWeave"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5",
  "httpx==0.28.1", "beautifulsoup4==4.13.3", "markdown-it-py==3.0.0", "docutils==0.21.2",
  "python-multipart==0.0.22", "pypdf==6.9.1", "pypdfium2==4.30.1",
  "defusedxml==0.7.1", "Pillow>=11.1,<13", "CairoSVG>=2.9,<3",
  "latex2mathml==3.81.0", "mdit-py-plugins==0.6.1",
  "jsonschema==4.23.0", "referencing==0.36.2"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "playwright==1.54.0", "reportlab>=4,<5"]

[project.scripts]
sourceloom = "sourceloom.cli:main"

[tool.setuptools.packages.find]
include = ["sourceloom*"]

[tool.setuptools.package-data]
sourceloom = ["static/*", "static/vendor/*", "roles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
