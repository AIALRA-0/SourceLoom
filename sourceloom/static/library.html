<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SourceLoom · 源织</title><link rel="stylesheet" href="/static/library.css"><script type="module" src="/static/library.js"></script></head>
<body><aside><a href="/" class="brand">SourceLoom <small>AIALRA · 源织</small></a><button id="new" class="primary">＋ 导入材料</button><div class="library-tools"><button id="new-folder">新建文件夹</button><button id="trash">回收站</button></div><label class="search"><span class="sr-only">搜索材料</span><input id="search" type="search" placeholder="搜索材料"></label><div class="tree-tools"><span>我的材料</span><button id="collapse-folders">全部收起</button></div><button id="selection-actions" hidden></button><nav id="tree" aria-label="材料文件树"></nav><div class="sidebar-foot">把原始资料，织成易读且可追溯的内容</div></aside><div id="sidebar-resize" role="separator" aria-label="调整材料栏宽度" aria-orientation="vertical" tabindex="0"></div>
<main><header><button id="toggle-tree" aria-label="显示或隐藏文件树">☰</button><span id="breadcrumb">我的材料</span><button id="refresh" aria-label="刷新">↻</button></header><p id="notice" role="status" hidden></p><div id="document"></div></main>
<dialog id="import-dialog"><form id="import-form"><h2>导入材料</h2><label>材料名称<input name="title" required maxlength="180" placeholder="例如：这周要读的论文"></label><label>保存到<select name="folder" id="import-folder"></select></label><label>选择文件<input name="files" type="file" multiple accept=".pdf,.docx,.md,.markdown,.txt,.html,.htm,.zip,.png,.jpg,.jpeg,.webp,.gif"></label><p class="hint">可以同时选择正文与图片，或上传包含附件的压缩包</p><label>或填写网页地址<input name="url" type="url" placeholder="https://"></label><label>改写要求<textarea name="goal" rows="2">保持原文主旨、作者意图与人称，完整保留信息，改善逻辑与可读性，不自行设计课程或情境</textarea></label><label>本份材料费用上限（美元）<input name="budget" type="number" min="0" max="20" step="0.01" value="0.20"></label><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">保存材料</button></div></form></dialog>
<dialog id="folder-dialog"><form id="folder-form"><h2 id="folder-dialog-title">新建文件夹</h2><label>名称<input name="name" required maxlength="180"></label><label>上级文件夹<select name="parent" id="folder-parent"></select></label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="manage-dialog"><form id="manage-form"><h2>管理材料</h2><label>名称<input name="title" required maxlength="180"></label><label>文件夹<select name="folder" id="manage-folder"></select></label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="editor-dialog"><form id="editor-form"><div class="editor-head"><h2>编辑正文</h2><span id="editor-position"></span><button type="button" data-close id="editor-close">关闭</button></div><div class="editor-tools" role="toolbar" aria-label="编辑工具"><button type="button" data-editor="undo">撤销</button><button type="button" data-editor="redo">重做</button><button type="button" data-editor="search">查找 / 替换</button><button type="button" data-editor="heading">标题</button><button type="button" data-editor="bold"><b>粗体</b></button><button type="button" data-editor="italic"><i>斜体</i></button><button type="button" data-editor="list">列表</button><button type="button" data-editor="quote">引用</button><button type="button" data-editor="link">链接</button><button type="button" data-editor="code">代码</button><button type="button" data-editor="preview" aria-pressed="false">预览</button><button type="submit" class="primary">保存</button></div><p id="editor-status" role="status"></p><button type="button" id="recover-local-edit" hidden>恢复本机未保存副本</button><button type="button" id="editor-server-version" hidden>查看服务器当前版本</button><div class="editor-layout"><nav id="editor-outline" aria-label="正文段落"></nav><div id="editor-mount"></div><iframe id="editor-preview" title="编辑预览" sandbox="allow-same-origin" hidden></iframe></div></form></dialog>
</body></html>
