<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SourceLoom · 源织</title><link rel="stylesheet" href="/static/library.css"><script type="module" src="/static/library.js"></script></head>
<body><aside><a href="/" class="brand">SourceLoom <small>AIALRA · 源织</small></a><button id="new" class="primary">＋ 导入材料</button><div class="library-tools"><button id="new-folder">新建文件夹</button><button id="trash">回收站</button></div><label class="search"><span class="sr-only">搜索材料</span><input id="search" type="search" placeholder="搜索材料"></label><nav id="tree" aria-label="材料文件树"></nav><div class="sidebar-foot">把原始资料，织成有据可循的教材</div></aside>
<main><header><button id="toggle-tree" aria-label="显示或隐藏文件树">☰</button><span id="breadcrumb">我的材料</span><button id="refresh" aria-label="刷新">↻</button></header><p id="notice" role="status" hidden></p><div id="document"></div></main>
<dialog id="import-dialog"><form id="import-form"><h2>导入材料</h2><label>材料名称<input name="title" required maxlength="180" placeholder="例如：这周要读的论文"></label><label>保存到<select name="folder" id="import-folder"></select></label><label>选择文件<input name="files" type="file" multiple accept=".pdf,.docx,.md,.markdown,.txt,.html,.htm,.zip,.png,.jpg,.jpeg,.webp,.gif"></label><p class="hint">可以同时选择正文与图片，或上传包含附件的压缩包</p><label>或填写网页地址<input name="url" type="url" placeholder="https://"></label><label>学习目标<textarea name="goal" rows="2">完整保留材料与叙述人称，从必要前提逐步讲清</textarea></label><label>本份材料费用上限（美元）<input name="budget" type="number" min="0" max="20" step="0.01" value="0.20"></label><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">保存材料</button></div></form></dialog>
<dialog id="folder-dialog"><form id="folder-form"><h2 id="folder-dialog-title">新建文件夹</h2><label>名称<input name="name" required maxlength="180"></label><label>上级文件夹<select name="parent" id="folder-parent"></select></label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="manage-dialog"><form id="manage-form"><h2>管理材料</h2><label>名称<input name="title" required maxlength="180"></label><label>文件夹<select name="folder" id="manage-folder"></select></label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="editor-dialog"><form id="editor-form"><h2>编辑正文</h2><label>选择段落<select id="editor-block"></select></label><label>正文<textarea id="editor-text" rows="18"></textarea></label><p class="hint">保存新版本后需要重新核对，原版本可以恢复</p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary">保存新版本</button></div></form></dialog>
</body></html>
